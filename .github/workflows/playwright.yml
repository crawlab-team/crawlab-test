name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      appUrl:
        required: false
        description: App URL
        default: http://localhost:8080
      apiEndpoint:
        required: false
        description: API Endpoint
        default: http://localhost:8000
      logLevel:
        required: false
        description: Log Level
        default: info
        type: choice
        options:
          - info
          - warning
          - debug
      retries:
        required: false
        description: Retries
        default: '2'
      workers:
        required: false
        description: Workers
        default: '1'
      timeout:
        required: false
        description: Timeout
        default: '60'
      version:
        required: false
        description: Version
        default: latest
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      crawlab:
        image: crawlabteam/crawlab:${{ github.ref_name }}
        env:
          CRAWLAB_NODE_MASTER: Y
          CRAWLAB_NODE_NAME: Master Node
          CRAWLAB_MONGO_HOST: mongo
          CRAWLAB_MONGO_PORT: 27017
          CRAWLAB_MONGO_DB: crawlab  # mongo database
          CRAWLAB_MONGO_USERNAME: username  # mongo username
          CRAWLAB_MONGO_PASSWORD: password  # mongo password
          CRAWLAB_MONGO_AUTHSOURCE: admin  # mongo auth source
          CRAWLAB_INIT_UMENG: "false"
          CRAWLAB_INIT_BAIDU_TONGJI: "false"
        ports:
          - 8080:8080
      mongo:
        image: mongo:5
        env:
          MONGO_INITDB_ROOT_USERNAME: username  # mongo username
          MONGO_INITDB_ROOT_PASSWORD: password  # mongo password
        ports:
          - 27017:27017
    env:
      APP_URL: ${{ github.event.inputs.appUrl || 'http://localhost:8080' }}
      API_ENDPOINT: ${{ github.event.inputs.apiEndpoint || 'http://localhost:8000' }}
      CODING_API_ENDPOINT: ${{ secrets.CODING_API_ENDPOINT }}
      CODING_API_TOKEN: ${{ secrets.CODING_API_TOKEN }}
      CODING_API_PROJECT_NAME: ${{ secrets.CODING_API_PROJECT_NAME }}
      LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
      RETRIES: ${{ github.event.inputs.retries || '2' }}
      WORKERS: ${{ github.event.inputs.workers || '2' }}
      TIMEOUT: ${{ github.event.inputs.timeout || '60' }}
      DISPLAY_BROWSER: false
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '14.x'
      - name: Install dependencies
        run: yarn install
      - name: Install Playwright
        run: npx playwright install
      - name: Validate containers
        run: |
          url="http://localhost:8080" && echo $url && curl -v $url > /dev/null
          url="http://localhost:8080/js/chunk-vendors.js" && echo $url && curl -v $url > /dev/null
          url="http://localhost:27017" && echo $url && curl -v $url > /dev/null
      #      - name: Validate network
      #        run: |
      #          #url="https://umini.shujupie.com/eg.js" && echo $url && curl -v $url > /dev/null
      #          #url="https://hm.baidu.com/hm.js" && echo $url && curl -v $url > /dev/null
      #          #url="https://d.alicdn.com/alilog/mlog/aplus/203467608.js" && echo $url && curl -v $url > /dev/null
      - name: Run tests
        run: yarn test
      - uses: actions/upload-artifact@v2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
