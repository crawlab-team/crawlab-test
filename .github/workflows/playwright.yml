name: Playwright Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      crawlab:
        image: crawlabteam/crawlab:develop
        env:
          CRAWLAB_NODE_MASTER: Y
          CRAWLAB_MONGO_HOST: mongo
          CRAWLAB_MONGO_PORT: 27017
          CRAWLAB_MONGO_DB: crawlab  # mongo database
          CRAWLAB_MONGO_USERNAME: username  # mongo username
          CRAWLAB_MONGO_PASSWORD: password  # mongo password
          CRAWLAB_MONGO_AUTHSOURCE: admin  # mongo auth source
        ports:
          - 8080:8080
      mongo:
        image: mongo:4.2
        env:
          MONGO_INITDB_ROOT_USERNAME: username  # mongo username
          MONGO_INITDB_ROOT_PASSWORD: password  # mongo password
        ports:
          - 27017:27017
    env:
      APP_URL: http://crawlab:8080
      API_ENDPOINT: http://localhost:8000
      DISPLAY_BROWSER: false
      CODING_API_ENDPOINT: https://crawlab.coding.net/open-api
      CODING_API_TOKEN: ${{ secrets.CODING_API_TOKEN }}
      CODING_API_PROJECT_NAME: crawlab
      LOG_LEVEL: info
      RETRIES: 2
      WORKERS: 2
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '14.x'
      - name: Install dependencies
        run: yarn install
      - name: Install Playwright
        run: npx playwright install
      - name: Run tests
        run: yarn test
      - uses: actions/upload-artifact@v2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
