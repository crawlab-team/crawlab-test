name: Test Specs

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      category:
        description: 'Test categories to run (space-separated: "api ui" or "all")'
        required: false
        type: string
        default: 'all'
      backend:
        description: 'Backend to use'
        required: false
        type: choice
        options:
          - 'auto'
          - 'script'
          - 'copilot'
        default: 'auto'
      spec_id:
        description: 'Specific spec ID to run (e.g., UI-001)'
        required: false
        type: string
      timeout:
        description: 'Timeout in minutes'
        required: false
        type: number
        default: 30
      image_tag:
        description: 'Crawlab Pro image tag to test'
        required: false
        type: string
        default: 'develop'

env:
  PYTHON_VERSION: '3.9'
  UV_VERSION: '0.5.20'
  CRAWLAB_API_URL: 'http://localhost:8080/api'
  CRAWLAB_IMAGE_TAG: ${{ inputs.image_tag || 'develop' }}

jobs:
  detect-changes:
    name: Detect Changed Categories
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.detect.outputs.categories }}
      run_tests: ${{ steps.detect.outputs.run_tests }}
      changed_specs: ${{ steps.detect.outputs.changed_specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed test categories
        id: detect
        run: |
          # For manual dispatch, use specified category/categories
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_CATEGORY="${{ inputs.category }}"
            
            # Trim whitespace and convert to lowercase
            INPUT_CATEGORY=$(echo "$INPUT_CATEGORY" | xargs | tr '[:upper:]' '[:lower:]')
            
            if [ "$INPUT_CATEGORY" = "all" ] || [ -z "$INPUT_CATEGORY" ]; then
              echo "categories=[\"api\",\"cluster\",\"database\",\"dependencies\",\"scheduler\",\"system\",\"ui\"]" >> $GITHUB_OUTPUT
              echo "Running all categories"
            else
              # Parse space-separated categories
              VALID_CATEGORIES=("api" "cluster" "database" "dependencies" "scheduler" "system" "ui")
              SELECTED_CATEGORIES=()
              
              for CAT in $INPUT_CATEGORY; do
                # Validate category
                if [[ " ${VALID_CATEGORIES[@]} " =~ " ${CAT} " ]]; then
                  SELECTED_CATEGORIES+=("$CAT")
                  echo "✓ Valid category: $CAT"
                else
                  echo "⚠ Warning: Invalid category '$CAT' (skipping)"
                fi
              done
              
              if [ ${#SELECTED_CATEGORIES[@]} -eq 0 ]; then
                echo "❌ No valid categories specified, using 'all'"
                echo "categories=[\"api\",\"cluster\",\"database\",\"dependencies\",\"scheduler\",\"system\",\"ui\"]" >> $GITHUB_OUTPUT
              else
                # Convert to JSON array
                CATEGORIES_JSON=$(printf '%s\n' "${SELECTED_CATEGORIES[@]}" | jq -R . | jq -s -c .)
                echo "categories=$CATEGORIES_JSON" >> $GITHUB_OUTPUT
                echo "Running categories: ${SELECTED_CATEGORIES[@]}"
              fi
            fi
            echo "run_tests=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # For push/PR, detect changes
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            # Handle first commit on branch
            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="HEAD^"
            fi
          fi
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD || echo "")
          
          # Determine which categories to test
          CATEGORIES=()
          
          if echo "$CHANGED_FILES" | grep -qE "^specs/api/|^runners/api/|^helpers/api/"; then
            CATEGORIES+=("api")
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^specs/cluster/|^runners/cluster/|^helpers/cluster/"; then
            CATEGORIES+=("cluster")
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^specs/database/|^runners/database/|^helpers/database/"; then
            CATEGORIES+=("database")
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^specs/dependencies/|^runners/dependencies/|^helpers/dependencies/"; then
            CATEGORIES+=("dependencies")
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^specs/scheduler/|^runners/scheduler/|^helpers/scheduler/"; then
            CATEGORIES+=("scheduler")
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^specs/system/|^runners/system/|^helpers/system/"; then
            CATEGORIES+=("system")
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^specs/ui/|^runners/ui/|^helpers/ui/"; then
            CATEGORIES+=("ui")
          fi
          
          # If core framework changed, test everything
          FRAMEWORK_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE "^cli.py|^backends/|^core/|^requirements.txt"; then
            CATEGORIES=("api" "cluster" "database" "dependencies" "scheduler" "system" "ui")
            FRAMEWORK_CHANGED=true
          fi
          
          # Detect specific changed specs (for targeted testing)
          CHANGED_SPECS=()
          
          if [ "$FRAMEWORK_CHANGED" = "false" ]; then
            # Extract spec IDs from changed spec files
            while IFS= read -r file; do
              if [[ "$file" =~ ^specs/([^/]+)/([A-Z]+-[0-9]+)- ]]; then
                SPEC_ID="${BASH_REMATCH[2]}"
                CHANGED_SPECS+=("$SPEC_ID")
                echo "Detected changed spec: $SPEC_ID"
              fi
            done <<< "$CHANGED_FILES"
          fi
          
          # Convert to JSON array
          if [ ${#CATEGORIES[@]} -eq 0 ]; then
            echo "No test-related changes detected"
            echo "categories=[]" >> $GITHUB_OUTPUT
            echo "changed_specs=[]" >> $GITHUB_OUTPUT
            echo "run_tests=false" >> $GITHUB_OUTPUT
          else
            CATEGORIES_JSON=$(printf '%s\n' "${CATEGORIES[@]}" | jq -R . | jq -s -c .)
            echo "categories=$CATEGORIES_JSON" >> $GITHUB_OUTPUT
            echo "run_tests=true" >> $GITHUB_OUTPUT
            echo "Will run tests for: ${CATEGORIES[@]}"
            
            # Output changed specs for targeted testing
            if [ ${#CHANGED_SPECS[@]} -gt 0 ]; then
              # Remove duplicates
              CHANGED_SPECS=($(printf '%s\n' "${CHANGED_SPECS[@]}" | sort -u))
              CHANGED_SPECS_JSON=$(printf '%s\n' "${CHANGED_SPECS[@]}" | jq -R . | jq -s -c .)
              echo "changed_specs=$CHANGED_SPECS_JSON" >> $GITHUB_OUTPUT
              echo "Changed specs: ${CHANGED_SPECS[@]}"
            else
              echo "changed_specs=[]" >> $GITHUB_OUTPUT
              echo "No specific specs changed (will run all in category)"
            fi
          fi
      
      - name: Generate detection summary
        if: always()
        run: |
          echo "## Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "**Trigger**: Manual workflow dispatch" >> $GITHUB_STEP_SUMMARY
            echo "**Categories**: \`${{ inputs.category }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Backend**: \`${{ inputs.backend }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Image Tag**: \`${{ env.CRAWLAB_IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ inputs.spec_id }}" ]; then
              echo "**Spec ID**: \`${{ inputs.spec_id }}\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
            echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Image Tag**: \`${{ env.CRAWLAB_IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.detect.outputs.run_tests }}" = "true" ]; then
            echo "**Status**: ✅ Tests will run" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Categories to test**:" >> $GITHUB_STEP_SUMMARY
            
            # Parse and display categories
            CATEGORIES='${{ steps.detect.outputs.categories }}'
            echo "$CATEGORIES" | jq -r '.[]' | while read cat; do
              echo "- \`$cat\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "**Status**: ⏭️ No tests to run" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No test-related changes detected in this commit." >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: Test ${{ matrix.category }}
    needs: detect-changes
    if: needs.detect-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout || '30') }}
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJson(needs.detect-changes.outputs.categories) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync
      
      - name: Install Playwright (UI tests only)
        if: matrix.category == 'ui'
        run: |
          uv run playwright install chromium --with-deps
      
      - name: Install GitHub Copilot CLI and MCP servers
        if: matrix.category == 'ui' || inputs.backend == 'copilot'
        run: |
          npm install -g @github/copilot
          echo "✓ GitHub Copilot CLI installed"
          copilot --version || echo "⚠ Copilot CLI may require authentication"
          
          # Install Playwright MCP server for UI automation
          npm install -g @playwright/mcp
          echo "✓ Playwright MCP server installed"
          
          # Setup MCP config for Copilot CLI
          mkdir -p ~/.copilot
          cp mcp-config.json ~/.copilot/mcp-config.json
          echo "✓ MCP config installed to ~/.copilot/mcp-config.json"
      
      - name: Set up Docker
        run: |
          docker --version
          docker compose version
      
      - name: Start Crawlab services
        env:
          CRAWLAB_IMAGE: crawlabteam/crawlab-pro:${{ env.CRAWLAB_IMAGE_TAG }}
          CRAWLAB_COMPOSE_NAMESPACE: crawlab_ci_${{ github.run_id }}
          CRAWLAB_LICENSE: ${{ secrets.CRAWLAB_LICENSE }}
        run: |
          echo "Starting Crawlab services for testing..."
          
          # Start services using test compose file
          docker compose -f docker-compose.test.yml up -d master worker mongo
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          timeout=180
          elapsed=0
          
          while [ $elapsed -lt $timeout ]; do
            # Check master health
            if docker compose -f docker-compose.test.yml exec -T master curl -f http://localhost:8080/api/health 2>/dev/null; then
              echo "✅ Master is healthy"
              
              # Check worker is running
              if docker compose -f docker-compose.test.yml ps worker | grep -q "Up"; then
                echo "✅ Worker is running"
                echo "All services are ready!"
                docker compose -f docker-compose.test.yml ps
                exit 0
              fi
            fi
            
            sleep 5
            elapsed=$((elapsed + 5))
            echo "Waiting... ($elapsed/$timeout seconds)"
          done
          
          echo "❌ Services failed to become healthy within timeout"
          docker compose -f docker-compose.test.yml logs
          exit 1
      
      - name: List available specs
        run: |
          echo "Available specs for category: ${{ matrix.category }}"
          ./cli.py --list-specs --category ${{ matrix.category }}
      
      - name: Run tests
        env:
          CRAWLAB_API_URL: ${{ env.CRAWLAB_API_URL }}
          CRAWLAB_LICENSE: ${{ secrets.CRAWLAB_LICENSE }}
          CRAWLAB_IMAGE: crawlabteam/crawlab-pro:${{ env.CRAWLAB_IMAGE_TAG }}
          CRAWLAB_COMPOSE_NAMESPACE: crawlab_ci_${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_CLI_PAT }}
          CI: true
        run: |
          # Create results directory
          mkdir -p results
          
          # Determine parallel worker count based on category
          case "${{ matrix.category }}" in
            api)
              PARALLEL_WORKERS=5  # 15 tests, I/O bound - safe for parallel
              ;;
            ui)
              PARALLEL_WORKERS=4  # 19 tests, browser tests - safe for parallel
              ;;
            cluster)
              PARALLEL_WORKERS=1  # 4 tests, Docker manipulation - MUST be sequential
              ;;
            scheduler)
              PARALLEL_WORKERS=3  # Task execution
              ;;
            database)
              PARALLEL_WORKERS=2
              ;;
            dependencies)
              PARALLEL_WORKERS=2
              ;;
            *)
              PARALLEL_WORKERS=2
              ;;
          esac
          
          echo "Category: ${{ matrix.category }}"
          echo "Parallel workers: $PARALLEL_WORKERS"
          
          # Determine which spec to run
          if [ -n "${{ inputs.spec_id }}" ]; then
            # Run specific spec from manual trigger (no parallel execution)
            SPEC_ID="${{ inputs.spec_id }}"
            echo "Running specific spec: $SPEC_ID (sequential mode)"
            
            BACKEND="${{ inputs.backend || 'auto' }}"
            
            if [ "$BACKEND" != "auto" ]; then
              uv run ./cli.py --spec "$SPEC_ID" --backend "$BACKEND" --ci
            else
              uv run ./cli.py --spec "$SPEC_ID" --ci
            fi
          else
            # Check if we have specific changed specs to run (targeted testing)
            CHANGED_SPECS='${{ needs.detect-changes.outputs.changed_specs }}'
            
            if [ "$CHANGED_SPECS" != "[]" ] && [ -n "$CHANGED_SPECS" ]; then
              # Targeted testing: only run changed specs (use sequential for precision)
              echo "Running targeted tests for changed specs (sequential mode for precision)"
              echo "Changed specs: $CHANGED_SPECS"
              
              # Parse JSON array of changed specs
              SPEC_LIST=$(echo "$CHANGED_SPECS" | jq -r '.[]')
              
              for SPEC_ID in $SPEC_LIST; do
                # Only run if spec belongs to current category
                if ls specs/${{ matrix.category }}/${SPEC_ID}-*.md 1> /dev/null 2>&1; then
                  echo ""
                  echo "================================"
                  echo "Running changed spec: $SPEC_ID"
                  echo "================================"
                  
                  uv run ./cli.py --spec "$SPEC_ID" --ci
                fi
              done
            else
              # Run all specs in category with parallel execution
              echo "Running all specs in category: ${{ matrix.category }} with $PARALLEL_WORKERS parallel workers"
              
              if [ $PARALLEL_WORKERS -gt 1 ]; then
                # Use parallel execution
                echo "Using parallel execution mode"
                uv run ./cli.py --category ${{ matrix.category }} --parallel $PARALLEL_WORKERS --ci
              else
                # Use sequential execution for single worker
                echo "Using sequential execution mode (1 worker)"
                uv run ./cli.py --category ${{ matrix.category }} --parallel 1 --ci
              fi
            fi
          fi
      
      - name: Collect Docker logs and diagnostics
        if: always()
        env:
          CRAWLAB_COMPOSE_NAMESPACE: crawlab_ci_${{ github.run_id }}
        run: |
          echo "Collecting Docker logs and diagnostics..."
          mkdir -p results/docker-logs results/system-info
          
          # Collect container logs
          echo "Collecting container logs..."
          for container in master worker mongo mysql postgres mssql elasticsearch; do
            FULL_NAME="${CRAWLAB_COMPOSE_NAMESPACE:-crawlab_test}_${container}"
            if docker ps -a --format '{{.Names}}' | grep -q "^${FULL_NAME}$"; then
              echo "Collecting logs from ${FULL_NAME}..."
              docker logs "${FULL_NAME}" > "results/docker-logs/${container}.log" 2>&1 || true
            fi
          done
          
          # Collect container inspect information
          echo "Collecting container inspect data..."
          for container in master worker mongo; do
            FULL_NAME="${CRAWLAB_COMPOSE_NAMESPACE:-crawlab_test}_${container}"
            if docker ps -a --format '{{.Names}}' | grep -q "^${FULL_NAME}$"; then
              docker inspect "${FULL_NAME}" > "results/docker-logs/${container}-inspect.json" 2>&1 || true
            fi
          done
          
          # Collect Docker Compose service status
          echo "Collecting Docker Compose status..."
          docker compose -f docker-compose.test.yml ps > results/docker-logs/compose-status.txt 2>&1 || true
          
          # Collect network information
          echo "Collecting network information..."
          docker network inspect crawlab-test_crawlab_test > results/docker-logs/network-inspect.json 2>&1 || true
          
          # Collect system information
          echo "Collecting system information..."
          {
            echo "=== System Info ==="
            uname -a
            echo ""
            echo "=== Docker Version ==="
            docker --version
            docker compose version
            echo ""
            echo "=== Disk Usage ==="
            df -h
            echo ""
            echo "=== Memory Usage ==="
            free -h
            echo ""
            echo "=== Docker System Info ==="
            docker system df
            echo ""
            echo "=== Running Containers ==="
            docker ps -a
          } > results/system-info/system.txt 2>&1 || true
          
          echo "Diagnostics collection complete"
          ls -lah results/docker-logs/ || true
          ls -lah results/system-info/ || true
      
      - name: Cleanup Crawlab services
        if: always()
        env:
          CRAWLAB_COMPOSE_NAMESPACE: crawlab_ci_${{ github.run_id }}
        run: |
          echo "Stopping Crawlab services..."
          docker compose -f docker-compose.test.yml down -v --remove-orphans || true
          echo "Cleanup complete"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.category }}-${{ github.run_number }}
          path: |
            results/
            !results/**/*.bak
          retention-days: 30
      
      - name: Generate test summary
        if: always()
        run: |
          echo "## 📊 Test Execution Results - ${{ matrix.category }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if results exist
          if [ -d "results" ] && [ "$(ls -A results)" ]; then
            # Use tracked counts if available
            if [ -f "results/.total_tests" ]; then
              TOTAL=$(cat results/.total_tests)
              PASSED=$(cat results/.passed_tests)
              FAILED=$(cat results/.failed_tests)
            else
              # Fallback: Count JSON files
              TOTAL=$(find results -name "*.json" -path "*/result_*.json" 2>/dev/null | wc -l)
              PASSED=$(find results -name "*.json" -path "*/result_*.json" -exec grep -l '"status".*"passed"' {} \; 2>/dev/null | wc -l)
              FAILED=$((TOTAL - PASSED))
            fi
            
            echo "### 📈 Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Tests** | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| **✅ Passed** | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| **❌ Failed** | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Success Rate** | $(awk "BEGIN {printf \"%.1f%%\", ($PASSED/$TOTAL)*100}") |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Display test results table if we have detailed results
            if [ -f "results/.test_results.json" ]; then
              echo "### 📋 Test Results Table" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Spec ID | Status | Duration |" >> $GITHUB_STEP_SUMMARY
              echo "|---------|--------|----------|" >> $GITHUB_STEP_SUMMARY
              
              # Read and display each test result
              jq -r '.[] | "| \(.spec) | \(.status) | \(.duration) |"' results/.test_results.json >> $GITHUB_STEP_SUMMARY
              
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Add collapsible section for detailed logs (from each spec's summary)
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>📄 Detailed Test Logs (Click to expand)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Include all individual test summaries if they exist
            for SUMMARY_FILE in results/summary_*.md; do
              if [ -f "$SUMMARY_FILE" ]; then
                echo "---" >> $GITHUB_STEP_SUMMARY
                cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Add information about artifacts
            echo "### 📦 Artifacts Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the test artifacts to view:" >> $GITHUB_STEP_SUMMARY
            echo "- 📄 Test result JSON files" >> $GITHUB_STEP_SUMMARY
            echo "- 📋 Docker container logs (master, worker, mongo, etc.)" >> $GITHUB_STEP_SUMMARY
            echo "- 🔍 Container inspect data" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 Network configuration" >> $GITHUB_STEP_SUMMARY
            echo "- 💻 System diagnostics" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    name: Test Summary
    needs: [detect-changes, test]
    if: always() && needs.detect-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate overall summary
        run: |
          echo "## Overall Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ **All tests passed**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test.result }}" = "failure" ]; then
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Tests were skipped or cancelled**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Categories tested: ${{ needs.detect-changes.outputs.categories }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed or were skipped"
            exit 1
          fi
