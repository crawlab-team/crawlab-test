name: Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.9'

jobs:
  smoke-test:
    name: Quick Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install crawlab-test package
        run: |
          uv sync
          echo "✅ Package installed in editable mode (includes all dependencies)"
      
      - name: Verify CLI works
        run: |
          chmod +x cli.py
          uv run ./cli.py --help
          uv run ./cli.py --list-specs
      
      - name: Run Ruff linter
        run: |
          echo "Running Ruff checks for critical issues..."
          # Check for fatal errors: undefined names, syntax errors, import issues
          # This replaces py_compile as Ruff catches syntax errors too
          uv run ruff check . --select=F,E9 --output-format=github
          echo "✅ No critical Ruff violations found"
      
      - name: Verify test structure
        run: |
          echo "Checking test structure..."
          
          # Check that specs directory exists
          if [ ! -d "specs" ]; then
            echo "❌ specs/ directory not found"
            exit 1
          fi
          
          # Check that required categories exist
          CATEGORIES=("api" "reliability" "performance" "integration" "ui")
          for cat in "${CATEGORIES[@]}"; do
            if [ ! -d "specs/$cat" ]; then
              echo "⚠️  Warning: specs/$cat/ directory not found"
            else
              COUNT=$(find "specs/$cat" -name "*.md" -type f | wc -l)
              echo "✅ specs/$cat/: $COUNT spec(s)"
            fi
          done
          
          # Check that package structure exists
          if [ ! -d "crawlab_test" ]; then
            echo "❌ crawlab_test package not found"
            exit 1
          fi
          
          if [ ! -f "crawlab_test/backends/script_backend.py" ]; then
            echo "❌ script_backend.py not found"
            exit 1
          fi
          
          if [ ! -f "crawlab_test/backends/copilot_backend.py" ]; then
            echo "❌ copilot_backend.py not found"
            exit 1
          fi
          
          echo "✅ Test structure looks good"
      
      - name: Test spec finder
        id: spec_finder
        run: |
          uv run python .github/workflows/test_spec_finder.py
      
      - name: Summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check step outcomes
          if [ "${{ steps.spec_finder.outcome }}" = "success" ]; then
            echo "✅ Spec finder tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Spec finder tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "✅ Ruff checks completed (syntax + code quality)" >> $GITHUB_STEP_SUMMARY
          echo "✅ CLI is executable and functional" >> $GITHUB_STEP_SUMMARY
          echo "✅ Test structure validated" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.spec_finder.outcome }}" = "success" ]; then
            echo "**Status**: ✅ All smoke tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status**: ❌ Some smoke tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
