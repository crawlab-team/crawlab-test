networks:
  crawlab_test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  mongo:
    image: mongo:5
    container_name: "${CRAWLAB_COMPOSE_NAMESPACE:-crawlab_test}_mongo"
    networks:
      crawlab_test:
        ipv4_address: 172.20.0.10
    environment:
      MONGO_INITDB_DATABASE: crawlab
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "-u", "admin", "-p", "admin", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mongo_data:/data/db

  master:
    image: "${CRAWLAB_IMAGE}"
    container_name: "${CRAWLAB_COMPOSE_NAMESPACE:-crawlab_test}_master"
    networks:
      crawlab_test:
        ipv4_address: 172.20.0.20
    environment:
      CRAWLAB_NODE_NAME: "Master Node"
      CRAWLAB_NODE_MASTER: "Y"
      CRAWLAB_MONGO_HOST: "mongo"
      CRAWLAB_MONGO_PORT: "27017"
      CRAWLAB_MONGO_DB: "crawlab"
      CRAWLAB_MONGO_USERNAME: "admin"
      CRAWLAB_MONGO_PASSWORD: "admin"
      CRAWLAB_LICENSE: "${CRAWLAB_LICENSE:-}"
      CRAWLAB_LOG_LEVEL: "info"
      CRAWLAB_SERVER_HOST: "0.0.0.0"
      CRAWLAB_SERVER_PORT: "8000"
      # gRPC server configuration
      CRAWLAB_GRPC_SERVER_HOST: "0.0.0.0"
      CRAWLAB_GRPC_SERVER_PORT: "9666"
      CRAWLAB_AUTH_KEY: "Crawlab2024!"
    ports:
      - "8080:8080"
      - "9666:9666"  # gRPC sync service
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  worker:
    image: "${CRAWLAB_IMAGE}"
    container_name: "${CRAWLAB_COMPOSE_NAMESPACE:-crawlab_test}_worker"
    networks:
      crawlab_test:
        ipv4_address: 172.20.0.30
    environment:
      CRAWLAB_NODE_NAME: "Worker Node 01"
      CRAWLAB_NODE_MASTER: "N"
      CRAWLAB_MASTER_HOST: "master"
      CRAWLAB_MASTER_PORT: "9666"
      CRAWLAB_LICENSE: "${CRAWLAB_LICENSE:-}"
      CRAWLAB_LOG_LEVEL: "info"
      CRAWLAB_GRPC_CLIENT_LOG_ENABLED: "true"
      CRAWLAB_GRPC_CLIENT_LOG_LEVEL: "info"
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[c]rawlab' && nc -z master 9666"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Database Integration Test Services
  mysql:
    image: mysql:8.0
    container_name: "${CRAWLAB_COMPOSE_NAMESPACE:-crawlab_test}_mysql"
    networks:
      crawlab_test:
        ipv4_address: 172.20.0.40
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: test
      # Optimize for CI - reduce memory usage
      MYSQL_INNODB_BUFFER_POOL_SIZE: 64M
      MYSQL_INNODB_LOG_FILE_SIZE: 8M
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    command: --innodb-buffer-pool-size=64M --innodb-log-file-size=8M

  postgres:
    image: postgres:14-alpine  # Use alpine for smaller size
    container_name: "${CRAWLAB_COMPOSE_NAMESPACE:-crawlab_test}_postgres"
    networks:
      crawlab_test:
        ipv4_address: 172.20.0.41
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: test
      # Optimize for CI
      POSTGRES_SHARED_BUFFERS: 16MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 64MB
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: "${CRAWLAB_COMPOSE_NAMESPACE:-crawlab_test}_mssql"
    networks:
      crawlab_test:
        ipv4_address: 172.20.0.42
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Admin123456"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Admin123456' -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    volumes:
      - mssql_data:/var/opt/mssql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: "${CRAWLAB_COMPOSE_NAMESPACE:-crawlab_test}_elasticsearch"
    networks:
      crawlab_test:
        ipv4_address: 172.20.0.43
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  mongo_data:
  mysql_data:
  postgres_data:
  mssql_data:
  elasticsearch_data:
