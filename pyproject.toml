[project]
name = "crawlab-test"
version = "1.0.0"
description = "Comprehensive automated testing framework for Crawlab and Crawlab Pro"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Crawlab Team", email = "team@crawlab.cn" }
]
keywords = ["crawlab", "testing", "automation", "web-scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Database connectivity
    "pymongo>=4.0.0",
    
    # HTTP client for API calls
    "requests>=2.28.0",
    
    # System and process management
    "psutil>=5.9.0",
    
    # Configuration and logging
    "pyyaml>=6.0",
    
    # UI Testing - Browser automation
    "playwright>=1.40.0",
    
    # gRPC for cluster testing
    # Note: grpcio-tools>=1.71.0 supports protobuf 6.x and requires Python>=3.9
    "grpcio>=1.71.0",
    "grpcio-tools>=1.71.0",
    "protobuf>=6.27.0",
    
    # Testing framework
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/crawlab-team/crawlab-test"
Repository = "https://github.com/crawlab-team/crawlab-test"
Documentation = "https://github.com/crawlab-team/crawlab-test/blob/main/README.md"
"Bug Tracker" = "https://github.com/crawlab-team/crawlab-test/issues"

[project.scripts]
crawlab-test = "crawlab_test.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawlab_test"]  # Package the crawlab_test module

[tool.uv]
dev-dependencies = []
# Enable package mode for proper pip install -e .
# package = false  # Commented out - we now want package mode enabled

[tool.pytest.ini_options]
testpaths = ["runners"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "E722"]

[tool.ruff.lint.per-file-ignores]
# Generated gRPC code has non-PEP8 names (generated by protoc)
"**/*_pb2_grpc.py" = ["N802"]
# Test runner files use TEST-ID_name.py naming convention
"runners/**/*.py" = ["N999"]
"runners/performance/*.py" = ["RUF001"]  # Also has emoji in test output
# Chinese characters and emoji in test data (intentional)
"**/browser_chinese_test.py" = ["RUF001"]
"**/file_sync_test.py" = ["RUF001"]
"**/collect_diagnostics.py" = ["RUF001"]
# Return in finally blocks for test results (intentional pattern)
"runners/api/*.py" = ["B012"]
